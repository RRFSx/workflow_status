name: Check for stale status updates

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # manual trigger

jobs:
  stale-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check status file staleness
        id: check
        run: |
          stale_files=""
          now=$(date +%s)

          for f in status/**/*.json; do
            # Skip _meta.json and history files
            [[ "$f" == *"_meta.json" ]] && continue
            [[ "$f" == *"_history.json" ]] && continue
            [[ ! -f "$f" ]] && continue

            updated=$(jq -r '.updated_at // empty' "$f" 2>/dev/null)
            if [[ -z "$updated" ]]; then
              echo "::warning::$f has no updated_at field"
              continue
            fi

            file_epoch=$(date -d "$updated" +%s 2>/dev/null || echo 0)
            age_min=$(( (now - file_epoch) / 60 ))

            if [ $age_min -gt 30 ]; then
              echo "::error::$f is ${age_min} minutes stale (last updated: $updated)"
              exp=$(jq -r '.experiment // "unknown"' "$f")
              cluster=$(jq -r '.cluster // "unknown"' "$f")
              stale_files="${stale_files}${exp} on ${cluster} (${age_min}m stale)\n"
            fi
          done

          if [[ -n "$stale_files" ]]; then
            echo "STALE=true" >> $GITHUB_OUTPUT
            # Store the stale info for the notification step
            {
              echo "STALE_INFO<<EOF"
              echo -e "$stale_files"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Create issue on stale status
        if: steps.check.outputs.STALE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const staleInfo = `${{ steps.check.outputs.STALE_INFO }}`;
            const title = `⚠️ Stale workflow status detected - ${new Date().toISOString().slice(0,16)}`;
            const body = `## Stale Status Files Detected\n\nThe following experiments have not updated their status in over 30 minutes:\n\n\`\`\`\n${staleInfo}\`\`\`\n\nThis may indicate:\n- The monitoring script on the HPC is not running\n- The HPC system is down\n- Network connectivity issues\n\nPlease investigate.`;

            // Check if there's already an open stale-status issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale-status'
            });

            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['stale-status']
              });
            }
