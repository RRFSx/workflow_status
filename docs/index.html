<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPC Workflow Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        state: {
                            succeeded: '#10b981', // emerald-500
                            running: '#3b82f6', // blue-500
                            queued: '#6366f1', // indigo-500
                            waiting: '#64748b', // slate-500
                            dead: '#ef4444', // red-500
                            submitting: '#eab308', // yellow-500
                            other: '#f97316', // orange-500
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        .task-header {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            height: 120px;
            text-align: left;
            padding-top: 8px;
            padding-bottom: 8px;
            white-space: nowrap;
        }
        .tooltip {
            position: relative;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            background-color: #333;
            color: #fff;
            text-align: left;
            padding: 8px;
            border-radius: 6px;
            position: absolute;
            z-index: 50;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
            font-size: 0.75rem;
            pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .dark .tooltip .tooltiptext {
            background-color: #1f2937;
            border: 1px solid #374151;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        .scrollbar-custom::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .scrollbar-custom::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .dark .scrollbar-custom::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        .dark .scrollbar-custom::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e2e8f0;
            transition: all 0.3s;
        }
        .toggle-label {
            width: 3rem;
            height: 1.5rem;
            background-color: #cbd5e1;
            border-radius: 9999px;
            transition: all 0.3s;
        }
        .dark .toggle-label {
            background-color: #475569;
        }
        .dark .toggle-checkbox {
            transform: translateX(1.5rem);
            border-color: #475569;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-200 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <h1 class="text-2xl font-bold tracking-tight">HPC Workflow Monitor</h1>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="text-sm flex flex-col items-end">
                    <div class="flex items-center gap-2">
                        <span class="text-gray-500 dark:text-gray-400">Next refresh in:</span>
                        <span id="countdown" class="font-mono font-bold text-blue-600 dark:text-blue-400">02:00</span>
                    </div>
                    <div class="text-xs text-gray-400 dark:text-gray-500 mt-1">
                        Last update: <span id="last-update-time">--</span>
                    </div>
                </div>
                
                <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-md transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800" title="Manual Refresh">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>

                <!-- Theme Toggle -->
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="theme-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" checked/>
                        <label for="theme-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </div>
            </div>
        </div>
    </header>

    <!-- Error Banner -->
    <div id="error-banner" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mx-auto max-w-7xl mt-4 w-full shadow-sm rounded-r-md" role="alert">
        <div class="flex items-center">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
            <p id="error-msg">Failed to fetch status data. Showing sample data mode.</p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Dashboard Grid -->
        <div id="cards-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-12">
            <!-- Cards will be injected here -->
        </div>

        <!-- Historical Trends Section -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                Historical Trends (Last 7 Days)
            </h2>
            
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <!-- Chart 1: Cycle Wall Time -->
                <div class="flex flex-col">
                    <h3 class="text-md font-semibold text-gray-700 dark:text-gray-300 mb-2 text-center">Cycle Wall Time (Minutes)</h3>
                    <div class="relative h-64 w-full bg-gray-50 dark:bg-gray-900 rounded border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <canvas id="wallTimeChart" class="absolute inset-0 w-full h-full"></canvas>
                    </div>
                    <div id="wallTimeLegend" class="mt-3 flex flex-wrap justify-center gap-3 text-xs"></div>
                </div>

                <!-- Chart 2: Dead Jobs -->
                <div class="flex flex-col">
                    <h3 class="text-md font-semibold text-gray-700 dark:text-gray-300 mb-2 text-center">Dead Job Count</h3>
                    <div class="relative h-64 w-full bg-gray-50 dark:bg-gray-900 rounded border border-gray-100 dark:border-gray-800 overflow-hidden">
                        <canvas id="deadJobsChart" class="absolute inset-0 w-full h-full"></canvas>
                    </div>
                    <div id="deadJobsLegend" class="mt-3 flex flex-wrap justify-center gap-3 text-xs"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-sm text-gray-500 dark:text-gray-400">
                Powered by workflow_status
            </div>
            <a href="#" id="github-link" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 text-sm text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                </svg>
                GitHub Repository
            </a>
        </div>
    </footer>

    <!-- Templates -->
    <template id="card-template">
        <div class="experiment-card bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col h-full transition-shadow hover:shadow-md">
            <!-- Header -->
            <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-start bg-gray-50/50 dark:bg-gray-800/50">
                <div>
                    <h2 class="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                        <span class="exp-name">experiment_name</span>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300 border border-blue-200 dark:border-blue-800 exp-cluster">cluster</span>
                    </h2>
                    <div class="text-sm text-gray-500 dark:text-gray-400 mt-1 flex items-center gap-2">
                        Host: <span class="font-mono exp-host">host</span>

                <div class="flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400 staleness-container bg-white dark:bg-gray-900 px-3 py-1.5 rounded-full shadow-sm border border-gray-100 dark:border-gray-700">
                    <div class="staleness-dot w-2.5 h-2.5 rounded-full"></div>
                    <span class="staleness-text font-medium"></span>
                </div>
            </div>

            <!-- Alerts -->
            <div class="exp-alerts"></div>

            <div class="p-5 flex-grow flex flex-col gap-5">
                <!-- Summary Stats -->
                <div>
                    <div class="flex justify-between items-end mb-2">
                        <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">Task Summary</h3>
                        <span class="text-xs text-gray-500 dark:text-gray-400"><span class="exp-total">0</span> Total Tasks</span>

                    <!-- Stacked Bar -->
                    <div class="w-full h-4 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden flex exp-bar shadow-inner">

                    <!-- Legend -->

                        <!-- Legend items injected here -->
                    </div>

                <!-- Cycles/Tasks Grid -->
                <div class="mt-2 border border-gray-200 dark:border-gray-700 rounded-md overflow-hidden flex-grow flex flex-col">
                    <button class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-left text-sm font-medium text-gray-700 dark:text-gray-300 flex justify-between items-center transition-colors grid-toggle border-b border-gray-200 dark:border-gray-700 focus:outline-none focus:bg-gray-100 dark:focus:bg-gray-700">
                        <span>Cycle/Task Matrix</span>
                        <svg class="w-5 h-5 transform transition-transform grid-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="grid-content hidden overflow-x-auto scrollbar-custom bg-white dark:bg-gray-900">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 exp-grid-header">
                                    <!-- Headers injected here -->
                                </tr>
                            </thead>
                            <tbody class="exp-grid-body divide-y divide-gray-100 dark:divide-gray-800">
                                <!-- Rows injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        // Configuration (auto-detects owner/repo when hosted on GitHub Pages, falls back to default)
        function detectRepo() {
            const host = window.location.hostname;
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (host.endsWith('.github.io') && pathParts.length >= 1) {
                const owner = host.replace(/\.github\.io$/, '');
                return `${owner}/${pathParts[0]}`;
            }
            return 'guoqing-noaa/workflow_status';
        }
        const REPO = detectRepo();
        const BRANCH = 'main';
        const RAW_BASE_URL = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
        const REFRESH_INTERVAL_SEC = 120; // 2 minutes

        // State
        let countdownSecs = REFRESH_INTERVAL_SEC;
        let timerInterval;
        let isDemoMode = false;
        
        // Color mapping for states
        const STATE_COLORS = {
            'SUCCEEDED': 'bg-state-succeeded',
            'RUNNING': 'bg-state-running',
            'QUEUED': 'bg-state-queued',
            'WAITING': 'bg-state-waiting',
            '-': 'bg-state-waiting',
            'DEAD': 'bg-state-dead',
            'SUBMITTING': 'bg-state-submitting',
            'OTHER': 'bg-state-other',
            'FAILED': 'bg-state-dead' // Alias
        };

        const CHART_COLORS = [
            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6'
        ];

        // --- Demo Data ---
        const SAMPLE_META = {
            "experiments": [
                {"cluster": "gaea-c6", "name": "rrfsdet_rt"},
                {"cluster": "hercules", "name": "global_ens"}
            ],
            "last_updated": new Date().toISOString()
        };

        const SAMPLE_STATUS = {
            "rrfsdet_rt": {
                "experiment": "rrfsdet_rt",
                "cluster": "gaea-c6",
                "updated_at": new Date(Date.now() - 1000 * 60 * 5).toISOString(), // 5 mins ago
                "monitor_host": "gaea61",
                "cycles": [
                    {
                        "cdate": "202610032100",
                        "tasks": [
                            {"name": "ungrib_ic", "state": "SUCCEEDED", "jobid": null, "exit_status": 0, "tries": 1, "duration": 56.0},
                            {"name": "fcst", "state": "RUNNING", "jobid": "12345678", "exit_status": "-", "tries": 1, "duration": 3600.0},
                            {"name": "upp_g01", "state": "QUEUED", "jobid": null, "exit_status": "-", "tries": 0, "duration": null},
                            {"name": "prep_ic", "state": "DEAD", "jobid": "12345000", "exit_status": 1, "tries": 3, "duration": 120.0}
                        ]
                    },
                    {
                        "cdate": "202610032000",
                        "tasks": [
                            {"name": "ungrib_ic", "state": "SUCCEEDED", "jobid": null, "exit_status": 0, "tries": 1, "duration": 55.0},
                            {"name": "fcst", "state": "SUCCEEDED", "jobid": "12345555", "exit_status": 0, "tries": 1, "duration": 3500.0},
                            {"name": "upp_g01", "state": "SUCCEEDED", "jobid": null, "exit_status": 0, "tries": 1, "duration": 300.0},
                            {"name": "prep_ic", "state": "SUCCEEDED", "jobid": "12344999", "exit_status": 0, "tries": 1, "duration": 110.0}
                        ]
                    }
                ],
                "alerts": {
                    "dead_jobs": [{"cycle": "202610032100", "task": "prep_ic", "tries": 3}],
                    "stall": false,
                    "stall_since": null,
                    "hung_jobs": []
                },
                "summary": {
                    "total_tasks": 30,
                    "succeeded": 20,
                    "running": 3,
                    "queued": 5,
                    "dead": 1,
                    "other": 1
                }
            },
            "global_ens": {
                "experiment": "global_ens",
                "cluster": "hercules",
                "updated_at": new Date(Date.now() - 1000 * 60 * 45).toISOString(), // 45 mins ago
                "monitor_host": "herc01",
                "cycles": [
                    {
                        "cdate": "202610031200",
                        "tasks": [
                            {"name": "init", "state": "SUCCEEDED", "jobid": null, "exit_status": 0, "tries": 1, "duration": 10.0},
                            {"name": "run_mem01", "state": "RUNNING", "jobid": "9991", "exit_status": "-", "tries": 1, "duration": 1800.0},
                            {"name": "run_mem02", "state": "RUNNING", "jobid": "9992", "exit_status": "-", "tries": 1, "duration": 1805.0}
                        ]
                    }
                ],
                "alerts": {
                    "dead_jobs": [],
                    "stall": true,
                    "stall_since": new Date(Date.now() - 1000 * 60 * 60).toISOString(),
                    "hung_jobs": ["run_mem01"]
                },
                "summary": {
                    "total_tasks": 10,
                    "succeeded": 1,
                    "running": 2,
                    "queued": 7,
                    "dead": 0,
                    "other": 0
                }
            }
        };

        const generateSampleHistory = () => {
            const history = {};
            const now = Date.now();
            const dayMs = 24 * 60 * 60 * 1000;
            
            for (let exp of ["rrfsdet_rt", "global_ens"]) {
                history[exp] = { entries: [] };
                for (let i = 6; i >= 0; i--) {
                    const ts = new Date(now - i * dayMs);
                    history[exp].entries.push({
                        timestamp: ts.toISOString(),
                        cycle: ts.toISOString().replace(/[-T:Z.]/g, '').slice(0, 12),
                        tasks_total: exp === "rrfsdet_rt" ? 30 : 10,
                        succeeded: exp === "rrfsdet_rt" ? 30 : 10,
                        dead: Math.floor(Math.random() * 2),
                        cycle_wall_time_min: exp === "rrfsdet_rt" ? 180 + Math.random()*20 : 300 + Math.random()*50
                    });
                }
            }
            return history;
        };
        const SAMPLE_HISTORY = generateSampleHistory();

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // Theme initialization
            const themeToggle = document.getElementById('theme-toggle');
            const htmlClass = document.documentElement.classList;
            
            // Check local storage or system preference
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlClass.add('dark');
                themeToggle.checked = true;
            } else {
                htmlClass.remove('dark');
                themeToggle.checked = false;
            }

            themeToggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    htmlClass.add('dark');
                    localStorage.theme = 'dark';
                } else {
                    htmlClass.remove('dark');
                    localStorage.theme = 'light';
                }
                // Redraw charts to update colors
                if(window.lastHistoryData) renderCharts(window.lastHistoryData);
            });

            // Set GitHub link
            document.getElementById('github-link').href = `https://github.com/${REPO}`;

            // Buttons
            document.getElementById('refresh-btn').addEventListener('click', () => {
                fetchData();
            });

            // Start loop
            fetchData();
            startTimer();
        });

        // --- Timer Logic ---
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            countdownSecs = REFRESH_INTERVAL_SEC;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                countdownSecs--;
                if (countdownSecs <= 0) {
                    fetchData();
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const min = Math.floor(countdownSecs / 60).toString().padStart(2, '0');
            const sec = (countdownSecs % 60).toString().padStart(2, '0');
            document.getElementById('countdown').textContent = `${min}:${sec}`;
        }

        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('last-update-time').textContent = now.toLocaleTimeString();
        }

        // --- Data Fetching ---
        async function fetchData() {
            document.getElementById('refresh-btn').classList.add('animate-spin');
            const container = document.getElementById('cards-container');
            const errorBanner = document.getElementById('error-banner');
            
            try {
                // Discover all status/<cluster>/<exp>.json files via GitHub Tree API (no _meta.json needed)
                const treeUrl = `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`;
                const treeResp = await fetch(treeUrl, { cache: "no-store" });
                if (!treeResp.ok) throw new Error(`GitHub Tree API failed: ${treeResp.status}`);
                const treeData = await treeResp.json();

                const statusPaths = (treeData.tree || [])
                    .filter(item => item.type === 'blob' && /^status\/[^/]+\/[^/]+\.json$/.test(item.path) && !item.path.endsWith('_history.json'))
                    .map(item => item.path)
                    .sort();

                if (statusPaths.length === 0) {
                    throw new Error('No status/<cluster>/<exp>.json files found in repository yet');
                }

                isDemoMode = false;
                errorBanner.classList.add('hidden');
                
                const statusData = {};
                const historyData = {};

                // Fetch each experiment's single combined JSON file
                await Promise.all(statusPaths.map(async (path) => {
                    const parts = path.split('/');
                    const cluster = parts[1];
                    const name = parts[2].replace(/\.json$/, '');
                    const key = `${cluster}:${name}`;
                    try {
                        const statusUrl = `${RAW_BASE_URL}/${path}?t=${Date.now()}`;
                        const statusResp = await fetch(statusUrl, { cache: "no-store" });

                        if (statusResp.ok) {
                            const doc = await statusResp.json();
                            statusData[key] = doc;
                            if (Array.isArray(doc.history) && doc.history.length > 0) {
                                historyData[key] = { entries: doc.history };
                            }
                        }
                    } catch (e) {
                        console.error(`Failed to fetch data for ${key}`, e);
                    }
                }));

                renderDashboard(statusData);
                window.lastHistoryData = historyData;
                renderCharts(historyData);

            } catch (error) {
                console.warn('Using fallback sample data due to error:', error);
                isDemoMode = true;
                errorBanner.classList.remove('hidden');
                renderDashboard(SAMPLE_STATUS);
                window.lastHistoryData = SAMPLE_HISTORY;
                renderCharts(SAMPLE_HISTORY);
            } finally {
                document.getElementById('refresh-btn').classList.remove('animate-spin');
                updateLastUpdate();
                startTimer();
            }
        }

        // --- Rendering ---
        function renderDashboard(statusData) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            if (Object.keys(statusData).length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">No experiment data found.</div>';
                return;
            }

            const template = document.getElementById('card-template');

            for (const [expName, data] of Object.entries(statusData)) {
                const clone = template.content.cloneNode(true);
                const card = clone.querySelector('.experiment-card');
                
                // Header
                clone.querySelector('.exp-name').textContent = data.experiment || expName;
                clone.querySelector('.exp-cluster').textContent = data.cluster || 'Unknown';
                clone.querySelector('.exp-host').textContent = data.monitor_host || 'Unknown';

                // Staleness
                const updatedTime = new Date(data.updated_at);
                const now = new Date();
                const diffMin = Math.floor((now - updatedTime) / 1000 / 60);
                
                const dot = clone.querySelector('.staleness-dot');
                const text = clone.querySelector('.staleness-text');
                text.textContent = isNaN(diffMin) ? 'Unknown' : `${diffMin} min ago`;

                if (isNaN(diffMin)) {
                    dot.classList.add('bg-gray-400');
                } else if (diffMin < 15) {
                    dot.classList.add('bg-emerald-500');
                } else if (diffMin < 30) {
                    dot.classList.add('bg-yellow-500');
                } else {
                    dot.classList.add('bg-red-500', 'animate-pulse-fast');
                    text.classList.add('text-red-600', 'dark:text-red-400');
                }

                // Alerts
                const alertsContainer = clone.querySelector('.exp-alerts');
                let hasAlerts = false;
                if (data.alerts) {
                    if (data.alerts.dead_jobs && data.alerts.dead_jobs.length > 0) {
                        hasAlerts = true;
                        alertsContainer.innerHTML += `
                            <div class="px-5 py-2.5 bg-red-50 dark:bg-red-900/20 border-b border-red-100 dark:border-red-900/30 flex items-start gap-2 text-sm text-red-800 dark:text-red-300">
                                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                                <div><strong>Dead Jobs:</strong> ${data.alerts.dead_jobs.map(j => `${j.task} (${j.cycle})`).join(', ')}</div>
                            </div>`;
                    }
                    if (data.alerts.stall) {
                        hasAlerts = true;
                        const stallDate = data.alerts.stall_since
                            ? new Date(isNaN(Number(data.alerts.stall_since)) ? data.alerts.stall_since : Number(data.alerts.stall_since) * 1000)
                            : null;
                        alertsContainer.innerHTML += `
                            <div class="px-5 py-2.5 bg-orange-50 dark:bg-orange-900/20 border-b border-orange-100 dark:border-orange-900/30 flex items-start gap-2 text-sm text-orange-800 dark:text-orange-300">
                                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                                <div><strong>Workflow Stalled</strong> ${stallDate && !isNaN(stallDate) ? `since ${stallDate.toLocaleTimeString()}` : ''}</div>
                            </div>`;
                    }
                    if (data.alerts.hung_jobs && data.alerts.hung_jobs.length > 0) {
                        hasAlerts = true;
                        const hungStr = data.alerts.hung_jobs.map(j =>
                            typeof j === 'string' ? j : `${j.task} (${j.cycle}, job ${j.jobid})`
                        ).join(', ');
                        alertsContainer.innerHTML += `
                            <div class="px-5 py-2.5 bg-orange-50 dark:bg-orange-900/20 border-b border-orange-100 dark:border-orange-900/30 flex items-start gap-2 text-sm text-orange-800 dark:text-orange-300">
                                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                                <div><strong>Hung Jobs:</strong> ${hungStr}</div>
                            </div>`;
                    }
                }

                // Summary
                const sum = data.summary || { total_tasks: 0, succeeded: 0, running: 0, queued: 0, submitting: 0, waiting: 0, dead: 0, other: 0 };
                clone.querySelector('.exp-total').textContent = sum.total_tasks;
                
                const bar = clone.querySelector('.exp-bar');
                const legend = clone.querySelector('.exp-legend');
                const states = ['succeeded', 'running', 'queued', 'submitting', 'waiting', 'dead', 'other'];
                const labels = ['Succeeded', 'Running', 'Queued', 'Submitting', 'Waiting', 'Dead', 'Other'];
                
                states.forEach((state, i) => {
                    const count = sum[state] || 0;
                    if (count > 0 && sum.total_tasks > 0) {
                        const pct = (count / sum.total_tasks) * 100;
                        const stateClass = STATE_COLORS[state.toUpperCase()] || STATE_COLORS['OTHER'];
                        
                        // Bar segment
                        const seg = document.createElement('div');
                        seg.className = `h-full ${stateClass} transition-all duration-500`;
                        if (state === 'running') seg.classList.add('animate-pulse');
                        seg.style.width = `${pct}%`;
                        seg.title = `${labels[i]}: ${count}`;
                        bar.appendChild(seg);
                        
                        // Legend item
                        legend.innerHTML += `
                            <div class="flex items-center gap-1.5">
                                <div class="w-2.5 h-2.5 rounded-sm ${stateClass}"></div>
                                <span class="text-gray-600 dark:text-gray-400 font-medium">${count} <span class="font-normal opacity-80">${labels[i]}</span></span>
                            </div>`;
                    }
                });

                // Grid setup
                const gridHeader = clone.querySelector('.exp-grid-header');
                const gridBody = clone.querySelector('.exp-grid-body');
                
                // Get all unique tasks across all cycles to form columns
                const allTasksSet = new Set();
                const cycles = [...(data.cycles || [])].reverse(); // Newest cycle first
                (data.cycles || []).forEach(c => {
                    if(c.tasks) c.tasks.forEach(t => allTasksSet.add(t.name));
                });
                const allTasks = Array.from(allTasksSet);

                // Build header
                gridHeader.innerHTML = `<th class="p-2 text-left text-xs font-medium text-gray-500 dark:text-gray-400 w-28 border-r border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 sticky left-0 z-10 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.1)]">Cycle</th>`;
                allTasks.forEach(t => {
                    gridHeader.innerHTML += `
                        <th class="p-1 border-r border-gray-200 dark:border-gray-700 last:border-0 align-bottom w-8 min-w-[2rem] bg-gray-50 dark:bg-gray-800/50">
                            <div class="task-header text-xs text-gray-600 dark:text-gray-400 inline-block">${t}</div>
                        </th>`;
                });

                // Build rows
                cycles.forEach(c => {
                    const row = document.createElement('tr');
                    const cycleStr = c.cdate.length === 12 ? c.cdate.slice(0, 10) : c.cdate;
                    const badge = c.cycle_state === 'Active'
                        ? '<span class="ml-1 inline-block w-1.5 h-1.5 rounded-full bg-blue-500" title="Active Cycle"></span>'
                        : '';
                    row.innerHTML = `<td class="p-2 text-xs font-mono text-gray-700 dark:text-gray-300 border-r border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 sticky left-0 z-10 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.1)] whitespace-nowrap">${cycleStr}${badge}</td>`;
                    
                    const taskMap = {};
                    if(c.tasks) c.tasks.forEach(t => taskMap[t.name] = t);

                    allTasks.forEach(tName => {
                        const t = taskMap[tName];
                        const td = document.createElement('td');
                        td.className = 'p-1 border-r border-gray-100 dark:border-gray-800 last:border-0 text-center';
                        
                        if (t) {
                            const stateClass = STATE_COLORS[t.state.toUpperCase()] || STATE_COLORS['OTHER'];
                            const isPulse = t.state === 'RUNNING' ? 'animate-pulse' : '';
                            td.innerHTML = `
                                <div class="tooltip w-6 h-6 mx-auto rounded ${stateClass} ${isPulse} flex items-center justify-center cursor-help ring-1 ring-black/5 dark:ring-white/10 shadow-sm">
                                    ${t.state === 'DEAD' ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>' : ''}
                                    <div class="tooltiptext">
                                        <strong>${t.name}</strong> (${c.cdate})<br>
                                        State: ${t.state}<br>
                                        JobID: ${t.jobid || 'N/A'}<br>
                                        Duration: ${t.duration !== null ? t.duration + 's' : 'N/A'}<br>
                                        Tries: ${t.tries !== null ? t.tries : 'N/A'}
                                    </div>
                                </div>
                            `;
                        } else {
                            td.innerHTML = `<div class="w-6 h-6 mx-auto bg-transparent border border-gray-100 dark:border-gray-800 border-dashed rounded"></div>`;
                        }
                        row.appendChild(td);
                    });
                    gridBody.appendChild(row);
                });

                // Toggle logic (expanded by default so current status is immediately visible)
                const toggleBtn = clone.querySelector('.grid-toggle');
                const gridContent = clone.querySelector('.grid-content');
                const chevron = clone.querySelector('.grid-chevron');
                gridContent.classList.remove('hidden');
                chevron.classList.add('rotate-180');
                
                toggleBtn.addEventListener('click', () => {
                    const isHidden = gridContent.classList.contains('hidden');
                    if (isHidden) {
                        gridContent.classList.remove('hidden');
                        chevron.classList.add('rotate-180');
                    } else {
                        gridContent.classList.add('hidden');
                        chevron.classList.remove('rotate-180');
                    }
                });

                container.appendChild(clone);
            }
        }

        // --- Charts Rendering ---
        function renderCharts(historyData) {
            if (!historyData || Object.keys(historyData).length === 0) return;

            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#d1d5db' : '#374151'; // gray-300 : gray-700
            const gridColor = isDark ? '#374151' : '#e5e7eb'; // gray-700 : gray-200

            // Extract unique timestamps across all experiments, sort them
            let allTs = new Set();
            for (const exp of Object.values(historyData)) {
                if(exp.entries) exp.entries.forEach(e => allTs.add(e.timestamp));
            }
            let timestamps = Array.from(allTs).sort((a, b) => new Date(a) - new Date(b));
            if (timestamps.length === 0) return;

            // Prepare datasets
            const experiments = Object.keys(historyData);
            const wallTimeDatasets = [];
            const deadJobsDatasets = [];

            experiments.forEach((expName, i) => {
                const color = CHART_COLORS[i % CHART_COLORS.length];
                const entries = historyData[expName].entries || [];
                
                // Map to common timestamps
                const wtData = timestamps.map(ts => {
                    const entry = entries.find(e => e.timestamp === ts);
                    return entry && entry.cycle_wall_time_min != null ? entry.cycle_wall_time_min : null;
                });
                
                const djData = timestamps.map(ts => {
                    const entry = entries.find(e => e.timestamp === ts);
                    return entry && entry.dead != null ? entry.dead : null;
                });

                wallTimeDatasets.push({ label: expName, color, data: wtData });
                deadJobsDatasets.push({ label: expName, color, data: djData });
            });

            // Format X-axis labels (MM/DD HH:mm)
            const labels = timestamps.map(ts => {
                const d = new Date(ts);
                return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            });

            // Draw Charts
            drawChart('wallTimeChart', 'wallTimeLegend', labels, wallTimeDatasets, textColor, gridColor, false);
            drawChart('deadJobsChart', 'deadJobsLegend', labels, deadJobsDatasets, textColor, gridColor, true);
        }

        function drawChart(canvasId, legendId, labels, datasets, textColor, gridColor, isIntY) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            
            // Handle DPI scaling
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const w = rect.width;
            const h = rect.height;

            ctx.clearRect(0, 0, w, h);

            // Chart layout
            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            const chartW = w - padding.left - padding.right;
            const chartH = h - padding.top - padding.bottom;

            // Find Min/Max Y
            let minY = 0;
            let maxY = 0;
            datasets.forEach(ds => {
                ds.data.forEach(val => {
                    if (val !== null) {
                        if (val > maxY) maxY = val;
                    }
                });
            });
            if (maxY === 0) maxY = 10; // Default if all zero
            maxY = Math.ceil(maxY * 1.1); // 10% padding
            if (isIntY) maxY = Math.ceil(maxY);

            // Draw Y Grid & Labels
            ctx.font = '10px sans-serif';
            ctx.fillStyle = textColor;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            const yTicks = 5;
            for (let i = 0; i <= yTicks; i++) {
                const yVal = (maxY / yTicks) * i;
                const yPos = padding.top + chartH - (i / yTicks) * chartH;
                
                // Grid line
                ctx.beginPath();
                ctx.moveTo(padding.left, yPos);
                ctx.lineTo(w - padding.right, yPos);
                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 1;
                ctx.stroke();

                // Label
                ctx.fillText(isIntY ? Math.round(yVal) : yVal.toFixed(1), padding.left - 5, yPos);
            }

            // Draw X Axis Labels (skip some if too many)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const stepX = chartW / Math.max(1, (labels.length - 1));
            const skip = Math.max(1, Math.ceil(labels.length / 8));

            labels.forEach((lbl, i) => {
                const xPos = padding.left + i * stepX;
                if (i % skip === 0 || i === labels.length - 1) {
                    ctx.fillText(lbl, xPos, h - padding.bottom + 5);
                }
            });

            // Draw Lines and Points
            datasets.forEach(ds => {
                ctx.beginPath();
                let hasMoved = false;
                
                ds.data.forEach((val, i) => {
                    if (val === null) return;
                    
                    const xPos = padding.left + i * stepX;
                    const yPos = padding.top + chartH - ((val / maxY) * chartH);
                    
                    if (!hasMoved) {
                        ctx.moveTo(xPos, yPos);
                        hasMoved = true;
                    } else {
                        ctx.lineTo(xPos, yPos);
                    }
                });
                
                ctx.strokeStyle = ds.color;
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.stroke();

                // Draw dots
                ds.data.forEach((val, i) => {
                    if (val === null) return;
                    const xPos = padding.left + i * stepX;
                    const yPos = padding.top + chartH - ((val / maxY) * chartH);
                    
                    ctx.beginPath();
                    ctx.arc(xPos, yPos, 3, 0, Math.PI * 2);
                    ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#1f2937' : '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = ds.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            });

            // Update Legend
            const legend = document.getElementById(legendId);
            if (legend) {
                legend.innerHTML = datasets.map(ds => `
                    <div class="flex items-center gap-1">
                        <div class="w-3 h-3 rounded-full" style="background-color: ${ds.color}"></div>
                        <span class="text-gray-600 dark:text-gray-400">${ds.label}</span>
                    </div>
                `).join('');
            }
        }

        // Handle window resize to redraw charts
        window.addEventListener('resize', () => {
            if (window.lastHistoryData) {
                renderCharts(window.lastHistoryData);
            }
        });

    </script>
</body>
